name: Local WordPress verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:integration
        env:
          SJ_WP_VERSION: "6.6"
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/sj-preview.log 2>&1 &
      - run: node tooling/wait.mjs
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-local-release
          path: |
            dist/
            test-results/
